
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adventure World</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #17233b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}
h2 { margin: 12px; color: #ffd447; }
#score { font-size: 20px; margin: 10px; }
canvas {
  width: 100%;
  max-width: 800px;
  background: #83d9ff;
  display: block;
  margin: auto;
  border: 3px solid white;
  touch-action: none;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 18px;
}
button {
  width: 85px;
  height: 65px;
  font-size: 27px;
  border: none;
  border-radius: 15px;
  background: #ffca35;
  color: #222;
  font-weight: bold;
  touch-action: none;
}
#message { color: #ffd447; }
</style>
</head>
<body>

<h2>🌍 Adventure World</h2>
<div id="score">⭐ Score: 0</div>

<canvas id="game" width="800" height="450"></canvas>

<div class="controls">
  <button id="left">⬅️</button>
  <button id="jump">⬆️</button>
  <button id="right">➡️</button>
</div>
<p id="message">Collect the coins and reach the end!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

let player = {
  x: 50, y: 300, w: 35, h: 45,
  vx: 0, vy: 0, speed: 4,
  grounded: false
};

let platforms = [
  {x:0,y:410,w:800,h:40},
  {x:150,y:330,w:130,h:18},
  {x:350,y:260,w:130,h:18},
  {x:550,y:330,w:130,h:18}
];

let coins = [
  {x:190,y:290,taken:false},
  {x:390,y:220,taken:false},
  {x:590,y:290,taken:false},
  {x:730,y:370,taken:false}
];

let score = 0;
let keys = {left:false,right:false};
let gameOver = false;

function drawPlayer() {
  ctx.fillStyle = "#ed4545";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  ctx.fillStyle = "white";
  ctx.fillRect(player.x+22,player.y+8,7,7);

  ctx.fillStyle = "black";
  ctx.fillRect(player.x+25,player.y+10,3,3);
}

function drawWorld() {
  ctx.fillStyle = "#83d9ff";
  ctx.fillRect(0,0,800,450);

  // Clouds
  ctx.fillStyle = "white";
  [100,350,650].forEach(x=>{
    ctx.beginPath();
    ctx.arc(x,65,22,0,Math.PI*2);
    ctx.arc(x+25,65,28,0,Math.PI*2);
    ctx.arc(x+50,65,20,0,Math.PI*2);
    ctx.fill();
  });

  // Platforms
  platforms.forEach(p=>{
    ctx.fillStyle="#269b45";
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle="#7b4a27";
    ctx.fillRect(p.x,p.y+9,p.w,p.h-9);
  });

  // Coins
  coins.forEach(c=>{
    if(!c.taken){
      ctx.fillStyle="#ffd700";
      ctx.beginPath();
      ctx.arc(c.x,c.y,12,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle="#e69b00";
      ctx.lineWidth=3;
      ctx.stroke();
    }
  });

  // Finish flag
  ctx.fillStyle="#333";
  ctx.fillRect(765,335,5,75);
  ctx.fillStyle="#ff3333";
  ctx.fillRect(770,335,25,20);

  drawPlayer();
}

function update() {
  if(gameOver) return;

  player.vx = 0;
  if(keys.left) player.vx = -player.speed;
  if(keys.right) player.vx = player.speed;

  player.x += player.vx;
  player.vy += 0.55;
  player.y += player.vy;

  player.grounded = false;

  platforms.forEach(p=>{
    if(
      player.x + player.w > p.x &&
      player.x < p.x+p.w &&
      player.y+player.h > p.y &&
      player.y+player.h < p.y+25 &&
      player.vy >= 0
    ){
      player.y = p.y-player.h;
      player.vy = 0;
      player.grounded = true;
    }
  });

  player.x = Math.max(0,Math.min(765,player.x));

  coins.forEach(c=>{
    if(!c.taken &&
      Math.abs((player.x+player.w/2)-c.x)<25 &&
      Math.abs((player.y+player.h/2)-c.y)<30
    ){
      c.taken = true;
      score += 10;
      scoreText.textContent = "⭐ Score: "+score;
    }
  });

  if(player.y > 450){
    player.x=50;
    player.y=300;
    player.vy=0;
    message.textContent="Oops! Try again!";
  }

  if(player.x>745 && player.y>300){
    gameOver=true;
    message.textContent="🏆 You Win! Score: "+score;
  }
}

function loop(){
  update();
  drawWorld();
  requestAnimationFrame(loop);
}

function jump(){
  if(player.grounded && !gameOver){
    player.vy=-12;
    player.grounded=false;
  }
}

function control(id,key){
  const btn=document.getElementById(id);
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });
  btn.addEventListener("pointerup",e=>{
    e.preventDefault();
    keys[key]=false;
  });
  btn.addEventListener("pointerleave",()=>{
    keys[key]=false;
  });
  btn.addEventListener("pointercancel",()=>{
    keys[key]=false;
  });
}

control("left","left");
control("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
  e.preventDefault();
  jump();
});

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") keys.left=true;
  if(e.key==="ArrowRight") keys.right=true;
  if(e.key===" " || e.key==="ArrowUp") jump();
});

document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft") keys.left=false;
  if(e.key==="ArrowRight") keys.right=false;
});

loop();
</script>
</body>
</html>
